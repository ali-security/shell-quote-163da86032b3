name: Node CI

on:
  push:
  workflow_dispatch:

jobs:
  latest:
    if: false
    name: 'latest majors'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # the `ljharb/actions/node/matrix@main` helper job that used to feed this
        # axis (`type: majors, preset: ">= 0.8"`) is pinned to an explicit list:
        # it emits majors 0.8-9 which have no installable build for the runners
        # this fork gets (x64 windows-latest, arm64 macos-latest), and a
        # dynamically-generated value cannot be pruned per-OS via `exclude:`.
        # node 0.4 + 23 remain covered by the Linux container build.
        node-version: ['24', '22', '20', '18', '16', '14']
        exclude:
          # node < 16 publishes no darwin-arm64 build; macos-latest is arm64
          - os: macos-latest
            node-version: '14'

    runs-on: ${{matrix.os}}

    steps:
    - name: Configure npm time machine registry
      run: npm config set registry https://:2024-11-27T21%3A33%3A37.690000Z@time-machines-npm.sealsecurity.io/
    - uses: actions/checkout@v4

    - uses: ljharb/actions/node/install@main
      name: 'nvm install ${{ matrix.node-version }} && npm install'
      with:
        node-version: ${{ matrix.node-version }}
        skip-ls-check: true
      if: matrix.os != 'windows-latest'

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
      if: matrix.os == 'windows-latest'

    - run: npm install
      if: matrix.os == 'windows-latest'

    - run: ./node_modules/.bin/tape 'test/**/*.js'
      shell: bash

  node:
    if: false
    name: 'node majors, windows/mac'
    needs: [latest]
    runs-on: ubuntu-latest
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2024-11-27T21%3A33%3A37.690000Z@time-machines-npm.sealsecurity.io/
      - run: 'echo tests completed'
